<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PustakaKita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" class="login">
  <main class="login-wrap">
    <section class="rak" aria-label="Tentang PustakaKita">
      <div class="punggung" aria-hidden="true">
        <span style="height:70%;background:#FF8A3D"></span><span style="height:92%;background:#1E2A78"></span>
        <span style="height:55%;background:#F4F6FB"></span><span style="height:80%;background:#C8283D"></span>
        <span style="height:100%;background:#1E2A78"></span><span style="height:62%;background:#FF8A3D"></span>
      </div>
      <h2>PustakaKita</h2>
      <p>Toko buku online untuk pesan, cek stok, dan lacak kiriman dalam satu tempat.</p>
    </section>
    <section class="panel">
      <img src="assets/logo-buku.jpeg" alt="" class="logo-login">
      <h1>Masuk</h1>
      <form id="formLogin" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err" aria-live="polite"></span></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><span class="err" aria-live="polite"></span></div>
        <button class="btn blok" type="submit">Login</button>
      </form>
      <div class="aksi">
        <button id="btnLupa" class="link" type="button">Lupa Password</button>
        <button id="btnDaftar" class="link" type="button">Daftar</button>
      </div>
      <p class="hint">Akun demo: <strong>siti@gmail.com</strong> / <strong>siti123</strong> (Admin)<br>atau <strong>rina@gmail.com</strong> / <strong>rina123</strong> (User)</p>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
