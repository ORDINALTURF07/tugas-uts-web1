<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Buku | PustakaKita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stok">
  <header class="topbar">
    <a class="brand" href="dashboard.html">Pustaka<b>Kita</b></a>
    <nav aria-label="Navigasi utama">
      <a href="dashboard.html">Dashboard</a>
      <a href="stok.html" aria-current="page">Katalog</a>
      <a href="checkout.html">Pemesanan</a>
      <a href="tracking.html">Tracking</a>
    </nav>
    <button id="btnKeluar" class="btn ghost" type="button">Keluar</button>
  </header>
  <main class="konten">
    <section class="kartu" aria-labelledby="judulKatalog">
      <h1 id="judulKatalog">Informasi Stok dan Katalog</h1>
      <div class="bar-alat">
        <p class="ringkas" id="ringkasan"></p>
        <input id="cari" type="search" placeholder="Cari judul, kategori, atau kode" aria-label="Cari buku">
      </div>
      <div class="tabel-wrap">
        <table>
          <caption class="ringkas" style="text-align:left;padding-bottom:.5rem">Data berasal dari <code>dataKatalogBuku</code> pada js/data.js</caption>
          <thead><tr><th scope="col">Sampul</th><th scope="col">Kode</th><th scope="col">Buku</th><th scope="col">Kategori</th><th scope="col" class="angka">Harga</th><th scope="col" class="angka">Stok</th><th scope="col">Aksi</th></tr></thead>
          <tbody id="tbodyStok"></tbody>
        </table>
      </div>
    </section>
    <section id="seksiTambah" class="kartu" aria-labelledby="judulTambah">
      <h2 id="judulTambah">Tambah stok baru</h2>
      <form id="formStok" novalidate>
        <div class="grid2">
          <div class="field"><label for="kode">Kode buku</label><input id="kode" name="kode" placeholder="ASIP4302"><span class="err"></span></div>
          <div class="field"><label for="judul">Judul</label><input id="judul" name="judul"><span class="err"></span></div>
          <div class="field"><label for="edisi">Edisi</label><input id="edisi" name="edisi" type="number" min="1"><span class="err"></span></div>
          <div class="field"><label for="kategori">Kategori</label><input id="kategori" name="kategori" list="daftarKategori"><datalist id="daftarKategori"><option value="Buku Ajar"><option value="Modul"><option value="Buku Referensi"></datalist><span class="err"></span></div>
          <div class="field"><label for="harga">Harga (Rp)</label><input id="harga" name="harga" type="number" min="0"><span class="err"></span></div>
          <div class="field"><label for="stok">Jumlah stok</label><input id="stok" name="stok" type="number" min="0"><span class="err"></span></div>
          <div class="field"><label for="gambar">Sampul buku (opsional, maks. 500 KB)</label><input id="gambar" name="gambar" type="file" accept="image/*"><span class="err"></span></div>
        </div>
        <button class="btn" type="submit">Tambah baris stok</button>
      </form>
    </section>
  </main>
  <footer><small>&copy; 2026 PustakaKita &ndash; Tugas UTS Pemrograman Web 1</small></footer>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
